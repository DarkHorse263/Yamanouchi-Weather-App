kind = "web"
previewPath = "/yamanouchi/"
title = "Yamanouchi Snow Intelligence"
version = "1.0.0"
id = "artifacts/yamanouchi"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 20651
name = "web"
paths = ["/yamanouchi/"]

[services.development]
run = "pnpm --filter @workspace/yamanouchi run dev"

[services.env]
PORT = "20651"
BASE_PATH = "/yamanouchi/"

[services.production]
build = ["pnpm", "--filter", "@workspace/yamanouchi", "run", "build"]
publicDir = "artifacts/yamanouchi/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
