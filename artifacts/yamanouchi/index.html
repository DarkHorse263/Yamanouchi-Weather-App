<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Yamanouchi Snow Intelligence</title>

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <!-- Theme colour (Android toolbar + iOS status bar) -->
    <meta name="theme-color" content="#0a0f1a" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Yama Snow" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- SEO / OG -->
    <meta name="description" content="Real-time snow conditions, 7-day forecasts and resort info for Yamanouchi ski areas — Shiga Kogen, Ryuoo and Yomase." />
    <meta property="og:title" content="Yamanouchi Snow Intelligence" />
    <meta property="og:description" content="Live snow data for Yamanouchi ski areas" />
    <meta property="og:image" content="/images/opengraph.jpg" />
    <meta property="og:type" content="website" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
