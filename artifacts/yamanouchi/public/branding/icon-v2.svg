<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="iconGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#1E293B"/>
  <!-- Z with mountain peak on top bar -->
  <path d="M14,20 L24,20 L32,10 L40,20 L50,20" stroke="url(#iconGrad2)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- curved diagonal (ski run / hiking trail) -->
  <path d="M50,20 Q28,34 16,48" stroke="url(#iconGrad2)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <!-- base bar -->
  <path d="M14,48 L50,48" stroke="url(#iconGrad2)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <!-- peak glow -->
  <circle cx="32" cy="10" r="3.5" fill="#3B82F6" opacity="0.25"/>
</svg>
