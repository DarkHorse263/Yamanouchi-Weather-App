<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 80" fill="none">
  <defs>
    <linearGradient id="zGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  <!-- "feel" -->
  <text x="0" y="58" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="52" font-weight="800" fill="#1E293B" letter-spacing="-2">feel</text>
  <!-- Z as mountain peak: top bar = ridge, diagonal = ski run with mogul, bottom = base -->
  <g transform="translate(136,6)">
    <!-- top ridge -->
    <path d="M0,14 L12,14 L20,4 L28,14 L36,14" stroke="url(#zGrad2)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- diagonal ski run with slight curve (trail/switchback feel) -->
    <path d="M36,14 Q18,36 6,56" stroke="url(#zGrad2)" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- base -->
    <path d="M0,56 L36,56" stroke="url(#zGrad2)" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- small snowflake/dot at the peak -->
    <circle cx="20" cy="4" r="3" fill="#3B82F6" opacity="0.3"/>
  </g>
  <!-- "like" -->
  <text x="176" y="58" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="52" font-weight="800" fill="#1E293B" letter-spacing="-2">like</text>
</svg>
