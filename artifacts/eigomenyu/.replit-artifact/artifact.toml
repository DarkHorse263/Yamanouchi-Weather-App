kind = "web"
previewPath = "/eigomenyu/"
title = "Eigomenyu"
version = "1.0.0"
id = "artifacts/eigomenyu"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 23716
name = "web"
paths = ["/eigomenyu/"]

[services.development]
run = "pnpm --filter @workspace/eigomenyu run dev"

[services.env]
PORT = "23716"
BASE_PATH = "/eigomenyu/"

[services.production]
build = ["pnpm", "--filter", "@workspace/eigomenyu", "run", "build"]
publicDir = "artifacts/eigomenyu/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
