<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Nagano Snow Intelligence</title>

    <!-- PWA manifest -->
    <link rel="manifest" href="manifest.webmanifest" />

    <!-- Favicon / app icon -->
    <link rel="icon" type="image/svg+xml" href="icon.svg" />

    <!-- Theme colour (Android toolbar + iOS status bar) -->
    <meta name="theme-color" content="#0a0f1a" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nagano Snow" />
    <link rel="apple-touch-icon" href="icon.svg" />

    <!-- SEO / OG -->
    <meta name="description" content="Real-time snow conditions, 7-day forecasts and resort info for all Nagano ski areas." />
    <meta property="og:title" content="Nagano Snow Intelligence" />
    <meta property="og:description" content="Live snow data for Nagano ski areas" />
    <meta property="og:image" content="images/opengraph.jpg" />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js', { scope: '/nagano/' }).catch(() => {});
        });
      }
    </script>
  </body>
</html>
