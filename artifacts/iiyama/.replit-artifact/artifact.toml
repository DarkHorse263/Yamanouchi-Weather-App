kind = "web"
previewPath = "/_legacy-iiyama/"
title = "[LEGACY] Iiyama Snow Intelligence"
version = "1.0.0"
id = "artifacts/iiyama"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 24019
name = "web"
paths = ["/_legacy-iiyama/"]

[services.development]
run = "pnpm --filter @workspace/iiyama run dev"

[services.env]
PORT = "24019"
BASE_PATH = "/_legacy-iiyama/"

[services.production]
build = ["pnpm", "--filter", "@workspace/iiyama", "run", "build"]
publicDir = "artifacts/iiyama/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
