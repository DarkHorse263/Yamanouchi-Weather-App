kind = "web"
previewPath = "/_legacy-snowy-mountains/"
title = "[LEGACY] Snowy Mountains Snow Intelligence"
version = "1.0.0"
id = "artifacts/snowy-mountains"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/_legacy-snowy-mountains/" ]
localPort = 23491

[services.development]
run = "pnpm --filter @workspace/snowy-mountains run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/snowy-mountains", "run", "build" ]
publicDir = "artifacts/snowy-mountains/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23491"
BASE_PATH = "/_legacy-snowy-mountains/"
