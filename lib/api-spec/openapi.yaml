openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Yamanouchi Snow Intelligence Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Home dashboard data
  - name: resorts
    description: Ski resort conditions
  - name: outlook
    description: Snow outlook and forecasts
  - name: alerts
    description: Powder alerts
  - name: accommodation
    description: Accommodation listings
  - name: dining
    description: Restaurants and bars
  - name: attractions
    description: Local attractions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get home dashboard data
      description: Returns aggregated conditions across all Yamanouchi ski areas
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"

  /resorts:
    get:
      operationId: getResorts
      tags: [resorts]
      summary: List all ski resorts with live conditions
      description: Returns all ski areas in Yamanouchi with current conditions grouped by region
      responses:
        "200":
          description: Resort list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resort"

  /resorts/{id}:
    get:
      operationId: getResort
      tags: [resorts]
      summary: Get a single resort
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resort detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resort"
        "404":
          description: Not found

  /map:
    get:
      operationId: getMapData
      tags: [resorts]
      summary: Get resort map markers
      description: Returns resort locations with coordinates for the map view
      responses:
        "200":
          description: Map markers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MapMarker"

  /outlook:
    get:
      operationId: getSnowOutlook
      tags: [outlook]
      summary: Get snow outlook forecast
      description: Returns 24h/48h/72h snowfall forecasts by region
      responses:
        "200":
          description: Snow outlook
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RegionOutlook"

  /alerts:
    get:
      operationId: getPowderAlerts
      tags: [alerts]
      summary: Get powder alerts
      description: Returns current powder alerts and recent storm events
      responses:
        "200":
          description: Powder alerts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertsData"

  /accommodation:
    get:
      operationId: getAccommodation
      tags: [accommodation]
      summary: List accommodation
      description: Returns hotels, ryokan, and other lodging in Yamanouchi
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [hotel, ryokan, guesthouse, apartment, all]
        - name: region
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Accommodation list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Accommodation"
    post:
      operationId: createAccommodation
      tags: [accommodation]
      summary: Create accommodation listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccommodationBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accommodation"

  /accommodation/{id}:
    patch:
      operationId: updateAccommodation
      tags: [accommodation]
      summary: Update accommodation listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccommodationBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accommodation"
        "404":
          description: Not found
    delete:
      operationId: deleteAccommodation
      tags: [accommodation]
      summary: Delete accommodation listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /dining:
    get:
      operationId: getDining
      tags: [dining]
      summary: List restaurants and bars
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [restaurant, bar, cafe, all]
        - name: region
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Dining list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiningVenue"
    post:
      operationId: createDining
      tags: [dining]
      summary: Create dining listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDiningBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiningVenue"

  /dining/{id}:
    patch:
      operationId: updateDining
      tags: [dining]
      summary: Update dining listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDiningBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiningVenue"
        "404":
          description: Not found
    delete:
      operationId: deleteDining
      tags: [dining]
      summary: Delete dining listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /attractions:
    get:
      operationId: getAttractions
      tags: [attractions]
      summary: List local attractions
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [onsen, culture, nature, activity, shopping, all]
        - name: region
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Attractions list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Attraction"
    post:
      operationId: createAttraction
      tags: [attractions]
      summary: Create attraction listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAttractionBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attraction"

  /attractions/{id}:
    patch:
      operationId: updateAttraction
      tags: [attractions]
      summary: Update attraction listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
