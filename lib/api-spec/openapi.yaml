openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Yamanouchi Snow Intelligence Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Home dashboard data
  - name: resorts
    description: Ski resort conditions
  - name: outlook
    description: Snow outlook and forecasts
  - name: alerts
    description: Powder alerts
  - name: accommodation
    description: Accommodation listings
  - name: dining
    description: Restaurants and bars
  - name: attractions
    description: Local attractions
  - name: eigomenyu
    description: Eigomenyu QR menu system
  - name: stays
    description: Curated, region-aware Stay (accommodation) listings backed by the on-disk dataset under artifacts/feelzlike/src/data/curated.
  - name: eats
    description: Curated, region-aware Eat (food & drink) listings backed by the on-disk dataset under artifacts/feelzlike/src/data/curated.
  - name: elevation-forecast
    description: Elevation-banded ski forecasts (upper / mid / lower lift) sourced from Weather Unlocked.
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: admin
    description: Admin-only endpoints (gated by Replit Auth + email allowlist).
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get home dashboard data
      description: Returns aggregated conditions across all Yamanouchi ski areas
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"

  /resorts:
    get:
      operationId: getResorts
      tags: [resorts]
      summary: List all ski resorts with live conditions
      description: Returns all ski areas in Yamanouchi with current conditions grouped by region
      responses:
        "200":
          description: Resort list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resort"

  /resorts/{id}:
    get:
      operationId: getResort
      tags: [resorts]
      summary: Get a single resort
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resort detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resort"
        "404":
          description: Not found

  /map:
    get:
      operationId: getMapData
      tags: [resorts]
      summary: Get resort map markers
      description: Returns resort locations with coordinates for the map view
      responses:
        "200":
          description: Map markers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MapMarker"

  /outlook:
    get:
      operationId: getSnowOutlook
      tags: [outlook]
      summary: Get snow outlook forecast
      description: Returns 24h/48h/72h snowfall forecasts by region
      responses:
        "200":
          description: Snow outlook
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RegionOutlook"

  /alerts:
    get:
      operationId: getPowderAlerts
      tags: [alerts]
      summary: Get powder alerts
      description: |
        Returns current powder alerts and recent storm events. The route accepts any canonical RegionId; results are filtered by `resort_id` (via LOCATION_TO_REGION) and storm `cluster` (via CLUSTER_TO_REGION). Regions without published rows return an empty payload with `X-Empty-Reason` header.
      parameters:
        - $ref: "#/components/parameters/RegionFilter"
      responses:
        "200":
          description: Powder alerts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertsData"
        "400":
          description: Invalid region value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /alerts/subscribe:
    post:
      operationId: subscribeToAlerts
      tags: [alerts]
      summary: Subscribe to powder alerts
      description: Creates (or updates) a powder-alert subscription for the given email and sends a verification email. Idempotent — re-submitting with the same email updates preferences.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscribeRequest"
      responses:
        "200":
          description: Subscription accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscribeResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /alerts/verify:
    get:
      operationId: verifyAlertSubscription
      tags: [alerts]
      summary: Confirm an email subscription via the link in the verification email
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResponse"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Subscriber not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /alerts/manage:
    get:
      operationId: getAlertPreferences
      tags: [alerts]
      summary: Load subscriber preferences via management token
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManageResponse"
        "400":
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateAlertPreferences
      tags: [alerts]
      summary: Update subscriber preferences via management token
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePreferencesBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManageResponse"
        "400":
          description: Invalid input or token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /alerts/unsubscribe:
    post:
      operationId: unsubscribeFromAlerts
      tags: [alerts]
      summary: One-click unsubscribe via tokenised link
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnsubscribeBody"
      responses:
        "200":
          description: Unsubscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericOkResponse"
        "400":
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /elevation-forecast:
    get:
      operationId: getElevationForecast
      tags: [elevation-forecast]
      summary: Elevation-banded 7-day forecast for an arbitrary mountain
      description: |
        Returns top / mid / bottom band weather and snow for the next 7 days,
        sourced from Open-Meteo. The API server makes three Open-Meteo calls
        (one per elevation band) so the temperature lapse rate is applied per
        band. Provide the mountain coordinates and summit elevation; mid and
        base elevations are derived proportionally on the server.
      parameters:
        - name: lat
          in: query
          required: true
          description: Mountain latitude in decimal degrees.
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: lng
          in: query
          required: true
          description: Mountain longitude in decimal degrees.
          schema:
            type: number
            minimum: -180
            maximum: 180
        - name: summitElevationM
          in: query
          required: true
          description: Summit / top-of-lift elevation in metres.
          schema:
            type: number
            minimum: 1
            maximum: 9000
        - name: name
          in: query
          required: false
          description: Optional display name for the mountain (echoed back in the response).
          schema:
            type: string
      responses:
        "200":
          description: Forecast envelope (forecast may be null when upstream returned no data).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElevationForecastResponse"
        "400":
          description: Invalid query parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /accommodation:
    get:
      operationId: getAccommodation
      tags: [accommodation]
      summary: List accommodation
      description: Returns hotels, ryokan, and other lodging in Yamanouchi
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [hotel, ryokan, guesthouse, apartment, all]
        - name: region
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Accommodation list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Accommodation"
    post:
      operationId: createAccommodation
      tags: [accommodation]
      summary: Create accommodation listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccommodationBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accommodation"

  /accommodation/{id}:
    patch:
      operationId: updateAccommodation
      tags: [accommodation]
      summary: Update accommodation listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccommodationBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accommodation"
        "404":
          description: Not found
    delete:
      operationId: deleteAccommodation
      tags: [accommodation]
      summary: Delete accommodation listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /dining:
    get:
      operationId: getDining
      tags: [dining]
      summary: List restaurants and bars
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [restaurant, bar, cafe, all]
        - name: region
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Dining list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiningVenue"
    post:
      operationId: createDining
      tags: [dining]
      summary: Create dining listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDiningBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiningVenue"

  /dining/{id}:
    patch:
      operationId: updateDining
      tags: [dining]
      summary: Update dining listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDiningBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiningVenue"
        "404":
          description: Not found
    delete:
      operationId: deleteDining
      tags: [dining]
      summary: Delete dining listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /attractions:
    get:
      operationId: getAttractions
      tags: [attractions]
      summary: List local attractions
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [onsen, culture, nature, activity, shopping, all]
        - name: region
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Attractions list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Attraction"
    post:
      operationId: createAttraction
      tags: [attractions]
      summary: Create attraction listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAttractionBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attraction"

  /attractions/{id}:
    patch:
      operationId: updateAttraction
      tags: [attractions]
      summary: Update attraction listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAttractionBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attraction"
        "404":
          description: Not found
    delete:
      operationId: deleteAttraction
      tags: [attractions]
      summary: Delete attraction listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /eigomenyu/auth/register:
    post:
      operationId: eigomenyuRegister
      tags: [eigomenyu]
      summary: Register a new restaurant owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EigomenyuRegisterBody"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EigomenyuOwner"
        "409":
          description: Email already registered

  /eigomenyu/auth/login:
    post:
      operationId: eigomenyuLogin
      tags: [eigomenyu]
      summary: Log in as restaurant owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EigomenyuLoginBody"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EigomenyuOwner"
        "401":
          description: Invalid credentials

  /eigomenyu/auth/logout:
    post:
      operationId: eigomenyuLogout
      tags: [eigomenyu]
      summary: Log out current owner session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EigomenyuLogoutResponse"

  /eigomenyu/auth/me:
    get:
      operationId: eigomenyuGetMe
      tags: [eigomenyu]
      summary: Get current authenticated owner
      responses:
        "200":
          description: Current owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EigomenyuOwner"
        "401":
          description: Not authenticated

  /eigomenyu/restaurants:
    post:
      operationId: eigomenyuCreateRestaurant
      tags: [eigomenyu]
      summary: Create a new restaurant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EigomenyuCreateRestaurantBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EigomenyuRestaurant"
        "409":
          description: Slug already taken

  /eigomenyu/restaurants/{slug}:
    get:
      operationId: eigomenyuGetRestaurant
      tags: [eigomenyu]
      summary: Get restaurant by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Restaurant details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EigomenyuRestaurant"
        "404":
          description: Not found
    patch:
      operationId: eigomenyuUpdateRestaurant
      tags: [eigomenyu]
      summary: Update a restaurant
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EigomenyuUpdateRestaurantBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EigomenyuRestaurant"
        "404":
          description: Not found

  /eigomenyu/restaurants/{slug}/items:
    get:
      operationId: eigomenyuGetMenuItems
      tags: [eigomenyu]
      summary: Get menu items for a restaurant
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Menu items list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EigomenyuMenuItem"
        "404":
          description: Restaurant not found
    post:
      operationId: eigomenyuCreateMenuItem
      tags: [eigomenyu]
      summary: Add a menu item to a restaurant
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EigomenyuCreateMenuItemBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EigomenyuMenuItem"
        "404":
          description: Restaurant not found

  /eigomenyu/restaurants/{slug}/items/{id}:
    patch:
      operationId: eigomenyuUpdateMenuItem
      tags: [eigomenyu]
      summary: Update a menu item
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EigomenyuUpdateMenuItemBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EigomenyuMenuItem"
        "404":
          description: Not found
    delete:
      operationId: eigomenyuDeleteMenuItem
      tags: [eigomenyu]
      summary: Delete a menu item
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /eigomenyu/translate:
    post:
      operationId: eigomenyuTranslate
      tags: [eigomenyu]
      summary: Translate a Japanese dish name to English using AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EigomenyuTranslateBody"
      responses:
        "200":
          description: Translation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EigomenyuTranslateResponse"
        "401":
          description: Authentication required
  /weather:
    get:
      operationId: getWeather
      tags: [weather]
      summary: Get weather for all resort locations
      description: Returns current weather and 7-day forecast for every configured resort. Pass `?region=` to restrict the response to a single region's resorts.
      parameters:
        - $ref: "#/components/parameters/RegionFilter"
      responses:
        "200":
          description: Weather data for all locations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeatherResponse"
        "400":
          description: Invalid region value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error fetching weather
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /weather/{locationId}:
    get:
      operationId: getLocationWeather
      tags: [weather]
      summary: Get weather for a specific location
      description: Returns current weather and 7-day forecast for a specific resort location
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9-]+$"
            description: |
              Weather location id (mountain, resort, town, or `<region-id>-roads`).
              Permissive pattern - the server is the source of truth for which
              ids resolve. Previously this was a hand-maintained enum that drifted
              behind the LOCATIONS array (e.g. VHC mountains were missing), forcing
              consumers to cast. Mirrors the `/webcams/{locationId}` schema.
        - name: snowElevationM
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 9000
          description: |
            Optional on-mountain elevation (metres) for the headline snow
            outlook. When provided, snowfallNext24h/48h/72h are derived at this
            height (snow falls higher up than the village) and the provenance is
            reported via snowfallOutlookElevationM / snowfallOutlookLevel.
            Temperature, feels-like and current conditions stay at the village.
      responses:
        "200":
          description: Weather data for the location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationWeather"
        "404":
          description: Location not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error fetching weather
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /weather/{locationId}/snow-report:
    get:
      operationId: getResortSnowReport
      tags: [weather]
      summary: Resort-reported snow conditions from the resort's official feed
      description: |
        Resort-REPORTED snow depth from the resort's own structured feed
        (pilot: Thredbo XML). Always returns 200 with `report: null` when the
        location has no feed adapter, the feed is unreachable, the payload
        fails strict parsing, or the feed's own updated timestamp is older
        than 36 hours. Never 404s for missing data - the shared client fetch
        throws on non-2xx and this endpoint is called for every resort.
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9-]+$"
            description: Weather location id. Mirrors /weather/{locationId}.
      responses:
        "200":
          description: Reported snow conditions, or report null when unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResortSnowReportResponse"
  /bus-services:
    get:
      operationId: getBusServices
      tags: [bus]
      summary: Get Cooma Coaches bus service information
      description: Returns Cooma Coaches Snowy Mountains bus service routes and timetables
      responses:
        "200":
          description: Bus service information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusServiceResponse"
  /webcams:
    get:
      operationId: getWebcams
      tags: [webcams]
      summary: Get all resort webcams
      description: Returns webcam feeds for every configured location. Pass `?region=` to restrict the response to a single region's webcams.
      parameters:
        - $ref: "#/components/parameters/RegionFilter"
      responses:
        "200":
          description: Webcam data for all locations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebcamResponse"
        "400":
          description: Invalid region value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /webcams/{locationId}:
    get:
      operationId: getLocationWebcams
      tags: [webcams]
      summary: Get webcams for a specific location
      description: Returns webcam feeds for a specific resort location
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9-]+$"
            description: Webcam location id (resort id, town id, or `<region-id>-roads` for roadside cams).
      responses:
        "200":
          description: Webcam data for the location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationWebcams"
        "404":
          description: Location not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /road-conditions:
    get:
      operationId: getRoadConditions
      tags: [roads]
      summary: Get alpine road conditions
      description: Returns current road conditions. The roads dataset is currently Snowy Mountains only; other regions return an empty roads list with an explanatory advice message.
      parameters:
        - $ref: "#/components/parameters/RegionFilter"
      responses:
        "200":
          description: Road condition data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoadConditionsResponse"
        "400":
          description: Invalid region value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /vic-emergency-incidents:
    get:
      operationId: getVicEmergencyIncidents
      tags: [roads]
      summary: Get live VicEmergency incidents on Victoria's High Country alpine roads
      description: |
        Fetches active VicEmergency incidents and warnings (closures, crashes,
        tree-down, fires) and filters them to the alpine road corridors that
        serve Victoria's High Country base towns. No upstream API key required.
        Cached server-side for 3 minutes.
      parameters:
        - name: town
          in: query
          required: false
          description: Optional VHC base town id to narrow results to roads that serve that town.
          schema:
            type: string
      responses:
        "200":
          description: VicEmergency incidents on alpine roads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VicEmergencyResponse"
        "502":
          description: Upstream feed unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /lift-status:
    get:
      operationId: getLiftStatus
      tags: [lifts]
      summary: Get lift status for all resorts
      description: Returns current lift operating status. Currently covers Thredbo, Perisher, Charlotte's Pass and Selwyn (Snowy Mountains).
      parameters:
        - $ref: "#/components/parameters/RegionFilter"
      responses:
        "200":
          description: Lift status data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiftStatusResponse"
        "400":
          description: Invalid region value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /lift-status/{locationId}:
    get:
      operationId: getLocationLiftStatus
      tags: [lifts]
      summary: Get lift status for a specific resort
      description: Returns lift operating status for a specific resort
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
            enum: [thredbo, perisher, charlottes-pass, selwyn]
      responses:
        "200":
          description: Lift status for the location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResortLiftStatus"
        "404":
          description: Location not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /regions/{region}/towns/{town}/stays:
    get:
      operationId: getTownStays
      tags: [stays]
      summary: List curated stays for a town
      description: Returns every Stay record from the curated dataset for the given (region, town). Order matches the underlying JSON file (curator-controlled). Country-specific extras are exposed via the discriminated `country` field on each Stay.
      parameters:
        - $ref: "#/components/parameters/StayEatRegionPath"
        - $ref: "#/components/parameters/StayEatTownPath"
      responses:
        "200":
          description: List of Stay records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Stay"
        "404":
          description: Region or town slug not recognised
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /regions/{region}/towns/{town}/stays/{stayId}:
    get:
      operationId: getTownStay
      tags: [stays]
      summary: Get a single curated stay
      parameters:
        - $ref: "#/components/parameters/StayEatRegionPath"
        - $ref: "#/components/parameters/StayEatTownPath"
        - $ref: "#/components/parameters/StayIdPath"
      responses:
        "200":
          description: Stay record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stay"
        "404":
          description: Region/town/stay slug not recognised
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /regions/{region}/towns/{town}/eats:
    get:
      operationId: getTownEats
      tags: [eats]
      summary: List curated eats for a town
      description: Returns every Eat record from the curated dataset for the given (region, town). Country-specific extras are exposed via the discriminated `country` field on each Eat.
      parameters:
        - $ref: "#/components/parameters/StayEatRegionPath"
        - $ref: "#/components/parameters/StayEatTownPath"
      responses:
        "200":
          description: List of Eat records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Eat"
        "404":
          description: Region or town slug not recognised
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /regions/{region}/towns/{town}/eats/{eatId}:
    get:
      operationId: getTownEat
      tags: [eats]
      summary: Get a single curated eat
      parameters:
        - $ref: "#/components/parameters/StayEatRegionPath"
        - $ref: "#/components/parameters/StayEatTownPath"
        - $ref: "#/components/parameters/EatIdPath"
      responses:
        "200":
          description: Eat record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Eat"
        "404":
          description: Region/town/eat slug not recognised
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the `returnTo` path on success.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token · `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
    RegionFilter:
      name: region
      in: query
      required: false
      description: Optional region filter. Omit to receive data for every region. Must be one of the canonical region ids returned by `/api/regions`.
      schema:
        $ref: "#/components/schemas/RegionId"
    StayEatRegionPath:
      name: region
      in: path
      required: true
      description: Curated-dataset region slug (underscore-separated, distinct from the kebab-case `RegionId` used by live weather APIs).
      schema:
        $ref: "#/components/schemas/StayEatRegionSlug"
    StayEatTownPath:
      name: town
      in: path
      required: true
      description: Town slug within the region.
      schema:
        $ref: "#/components/schemas/TownSlug"
    StayIdPath:
      name: stayId
      in: path
      required: true
      description: Stay record id (slug, unique within the curated dataset).
      schema:
        type: string
    EatIdPath:
      name: eatId
      in: path
      required: true
      description: Eat record id (slug, unique within the curated dataset).
      schema:
        type: string
  schemas:
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    RegionId:
      type: string
      enum:
        - snowy-mountains
        - victorias-high-country
        - tasmania
        - yamanouchi
        - nozawa-onsen
        - iiyama
        - hakuba-valley
        - myoko
        - niseko
        - furano
        - rusutsu-kiroro
        - yuzawa
        - zao-onsen
        - hakkoda-aomori-spring
        - appi-shizukuishi
        - queenstown
        - wanaka
        - mt-hutt
        - ruapehu
      description: |
        Canonical region identifier used across the FeelZlike platform.

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Dashboard:
      type: object
      properties:
        updatedAt:
          type: string
        liveTime:
          type: string
        nextUpdate:
          type: string
        totalSkiAreas:
          type: integer
        avgTemp:
          type: ["number", "null"]
        avgWind:
          type: ["number", "null"]
        topSnow24h:
          type: ["number", "null"]
        bestBase:
          type: ["number", "null"]
        bestResort:
          $ref: "#/components/schemas/Resort"
        regions:
          type: array
          items:
            $ref: "#/components/schemas/RegionSummary"
      required:
        - updatedAt
        - liveTime
        - nextUpdate
        - totalSkiAreas
        - avgTemp
        - avgWind
        - topSnow24h
        - bestBase
        - bestResort
        - regions

    RegionSummary:
      type: object
      properties:
        name:
          type: string
        nameJa:
          type: string
        resortCount:
          type: integer
        avgTemp:
          type: ["number", "null"]
        topSnow:
          type: ["number", "null"]
        bestBase:
          type: ["number", "null"]
      required:
        - name
        - nameJa
        - resortCount
        - avgTemp
        - topSnow
        - bestBase

    Resort:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        nameJa:
          type: ["string", "null"]
        region:
          type: string
        regionJa:
          type: ["string", "null"]
        snow24h:
          type: ["number", "null"]
        baseDepth:
          type: ["number", "null"]
        temp:
          type: ["number", "null"]
        wind:
          type: ["number", "null"]
        snowTomorrow:
          type: ["number", "null"]
        snowScore:
          type: ["number", "null"]
        rank:
          type: ["integer", "null"]
        weatherStation:
          type: ["string", "null"]
        sourceUpdatedAt:
          type: ["string", "null"]
        lat:
          type: ["number", "null"]
        lng:
          type: ["number", "null"]
        elevation:
          type: ["integer", "null"]
        websiteUrl:
          type: ["string", "null"]
      required:
        - id
        - name
        - region
        - snow24h
        - baseDepth
        - temp
        - wind
        - snowTomorrow
        - snowScore
        - rank

    MapMarker:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        nameJa:
          type: ["string", "null"]
        region:
          type: string
        lat:
          type: number
        lng:
          type: number
        snow24h:
          type: ["number", "null"]
        baseDepth:
          type: ["number", "null"]
        rank:
          type: ["integer", "null"]
        snowLevel:
          type: string
          enum: [heavy, moderate, light, none]
      required:
        - id
        - name
        - region
        - lat
        - lng
        - snowLevel

    RegionOutlook:
      type: object
      properties:
        region:
          type: string
        regionJa:
          type: string
        rank:
          type: integer
        signal:
          type: string
        snow24h:
          type: ["number", "null"]
        snow48h:
          type: ["number", "null"]
        snow72h:
          type: ["number", "null"]
        level:
          type: string
          enum: [None, Low, Moderate, High, Extreme]
        updatedAt:
          type: string
      required:
        - region
        - regionJa
        - rank
        - signal
        - snow24h
        - snow48h
        - snow72h
        - level
        - updatedAt

    AlertsData:
      type: object
      properties:
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/PowderAlert"
        stormTracker:
          type: array
          items:
            $ref: "#/components/schemas/StormEvent"
        updatedAt:
          type: string
      required:
        - alerts
        - stormTracker
        - updatedAt

    PowderAlert:
      type: object
      properties:
        id:
          type: string
        resort:
          type: string
        region:
          type: string
        expectedSnow:
          type: ["number", "null"]
        alertLevel:
          type: string
          enum: [watch, warning, powder_day]
        message:
          type: string
        messageJa:
          type: ["string", "null"]
        issuedAt:
          type: string
        expiresAt:
          type: ["string", "null"]
      required:
        - id
        - resort
        - region
        - alertLevel
        - message
        - issuedAt

    StormEvent:
      type: object
      properties:
        id:
          type: string
        region:
          type: string
        totalSnow:
          type: ["number", "null"]
        peakSnow24h:
          type: ["number", "null"]
        startDate:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, incoming, ended]
        description:
          type: string
        descriptionJa:
          type: ["string", "null"]
      required:
        - id
        - region
        - status
        - description

    SubscribeRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        regions:
          type: array
          items:
            type: string
          minItems: 1
        mountains:
          type: array
          items:
            type: string
        snowfallThresholdCm:
          type: integer
          minimum: 5
          maximum: 50
        horizonHours:
          type: integer
          enum: [24, 48, 72]
        delivery:
          type: string
          enum: [email, push, both]
        timezone:
          type: string
        consent:
          type: boolean
          description: Must be true. Plain-English consent that we'll only email when the threshold is met and unsubscribe is one-click.
      required:
        - email
        - regions
        - consent

    SubscribeResponse:
      type: object
      properties:
        ok:
          type: boolean
        status:
          type: string
          enum: [verification_sent, already_verified]
        message:
          type: string
        emailDelivered:
          type: boolean
        devVerifyUrl:
          type: ["string", "null"]
          description: Present only in development when no email provider is configured. Lets the developer click the verification link without an inbox.
      required:
        - ok
        - status
        - message

    VerifyResponse:
      type: object
      properties:
        ok:
          type: boolean
        email:
          type: string
        manageToken:
          type: string
        manageUrl:
          type: string
      required:
        - ok
        - email
        - manageToken
        - manageUrl

    SubscriberPreferences:
      type: object
      properties:
        email:
          type: string
        regions:
          type: array
          items:
            type: string
        mountains:
          type: array
          items:
            type: string
        snowfallThresholdCm:
          type: integer
        horizonHours:
          type: integer
        delivery:
          type: string
          enum: [email, push, both]
        timezone:
          type: string
        verified:
          type: boolean
        unsubscribed:
          type: boolean
      required:
        - email
        - regions
        - mountains
        - snowfallThresholdCm
        - horizonHours
        - delivery
        - timezone
        - verified
        - unsubscribed

    ManageResponse:
      type: object
      properties:
        ok:
          type: boolean
        subscriber:
          $ref: "#/components/schemas/SubscriberPreferences"
      required:
        - ok
        - subscriber

    UpdatePreferencesBody:
      type: object
      properties:
        regions:
          type: array
          items:
            type: string
          minItems: 1
        mountains:
          type: array
          items:
            type: string
        snowfallThresholdCm:
          type: integer
          minimum: 5
          maximum: 50
        horizonHours:
          type: integer
          enum: [24, 48, 72]
        delivery:
          type: string
          enum: [email, push, both]
        timezone:
          type: string
      required:
        - regions

    UnsubscribeBody:
      type: object
      properties:
        reason:
          type: ["string", "null"]
          description: Optional one of "too_many", "wrong_threshold", "not_relevant", "other".

    GenericOkResponse:
      type: object
      properties:
        ok:
          type: boolean
        message:
          type: string
      required:
        - ok

    Accommodation:
