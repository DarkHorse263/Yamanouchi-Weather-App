openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Yamanouchi Snow Intelligence Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Home dashboard data
  - name: resorts
    description: Ski resort conditions
  - name: outlook
    description: Snow outlook and forecasts
  - name: alerts
    description: Powder alerts
  - name: accommodation
    description: Accommodation listings
  - name: dining
    description: Restaurants and bars
  - name: attractions
    description: Local attractions
  - name: eigomenyu
    description: Eigomenyu QR menu system
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get home dashboard data
      description: Returns aggregated conditions across all Yamanouchi ski areas
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"

  /resorts:
    get:
      operationId: getResorts
      tags: [resorts]
      summary: List all ski resorts with live conditions
      description: Returns all ski areas in Yamanouchi with current conditions grouped by region
      responses:
        "200":
          description: Resort list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resort"

  /resorts/{id}:
    get:
      operationId: getResort
      tags: [resorts]
      summary: Get a single resort
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resort detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resort"
        "404":
          description: Not found

  /map:
    get:
      operationId: getMapData
      tags: [resorts]
      summary: Get resort map markers
      description: Returns resort locations with coordinates for the map view
      responses:
        "200":
          description: Map markers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MapMarker"

  /outlook:
    get:
      operationId: getSnowOutlook
      tags: [outlook]
      summary: Get snow outlook forecast
      description: Returns 24h/48h/72h snowfall forecasts by region
      responses:
        "200":
          description: Snow outlook
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RegionOutlook"

  /alerts:
    get:
      operationId: getPowderAlerts
      tags: [alerts]
      summary: Get powder alerts
      description: Returns current powder alerts and recent storm events
      responses:
        "200":
          description: Powder alerts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertsData"

  /accommodation:
    get:
      operationId: getAccommodation
      tags: [accommodation]
      summary: List accommodation
      description: Returns hotels, ryokan, and other lodging in Yamanouchi
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [hotel, ryokan, guesthouse, apartment, all]
        - name: region
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Accommodation list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Accommodation"
    post:
      operationId: createAccommodation
      tags: [accommodation]
      summary: Create accommodation listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccommodationBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accommodation"

  /accommodation/{id}:
    patch:
      operationId: updateAccommodation
      tags: [accommodation]
      summary: Update accommodation listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccommodationBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accommodation"
        "404":
          description: Not found
    delete:
      operationId: deleteAccommodation
      tags: [accommodation]
      summary: Delete accommodation listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /dining:
    get:
      operationId: getDining
      tags: [dining]
      summary: List restaurants and bars
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [restaurant, bar, cafe, all]
        - name: region
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Dining list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiningVenue"
    post:
      operationId: createDining
      tags: [dining]
      summary: Create dining listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDiningBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiningVenue"

  /dining/{id}:
    patch:
      operationId: updateDining
      tags: [dining]
      summary: Update dining listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDiningBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiningVenue"
        "404":
          description: Not found
    delete:
      operationId: deleteDining
      tags: [dining]
      summary: Delete dining listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /attractions:
    get:
      operationId: getAttractions
      tags: [attractions]
      summary: List local attractions
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [onsen, culture, nature, activity, shopping, all]
        - name: region
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Attractions list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Attraction"
    post:
      operationId: createAttraction
      tags: [attractions]
      summary: Create attraction listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAttractionBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attraction"

  /attractions/{id}:
    patch:
      operationId: updateAttraction
      tags: [attractions]
      summary: Update attraction listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAttractionBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attraction"
        "404":
          description: Not found
    delete:
      operationId: deleteAttraction
      tags: [attractions]
      summary: Delete attraction listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /eigomenyu/auth/register:
    post:
      operationId: eigomenyuRegister
      tags: [eigomenyu]
      summary: Register a new restaurant owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EigomenyuRegisterBody"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EigomenyuOwner"
        "409":
          description: Email already registered

  /eigomenyu/auth/login:
    post:
      operationId: eigomenyuLogin
      tags: [eigomenyu]
      summary: Log in as restaurant owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EigomenyuLoginBody"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EigomenyuOwner"
        "401":
          description: Invalid credentials

  /eigomenyu/auth/logout:
    post:
      operationId: eigomenyuLogout
      tags: [eigomenyu]
      summary: Log out current owner session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EigomenyuLogoutResponse"

  /eigomenyu/auth/me:
    get:
      operationId: eigomenyuGetMe
      tags: [eigomenyu]
      summary: Get current authenticated owner
      responses:
        "200":
          description: Current owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EigomenyuOwner"
        "401":
          description: Not authenticated

  /eigomenyu/restaurants:
    post:
      operationId: eigomenyuCreateRestaurant
      tags: [eigomenyu]
      summary: Create a new restaurant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EigomenyuCreateRestaurantBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EigomenyuRestaurant"
        "409":
          description: Slug already taken

  /eigomenyu/restaurants/{slug}:
    get:
      operationId: eigomenyuGetRestaurant
      tags: [eigomenyu]
      summary: Get restaurant by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Restaurant details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EigomenyuRestaurant"
        "404":
          description: Not found
    patch:
      operationId: eigomenyuUpdateRestaurant
      tags: [eigomenyu]
      summary: Update a restaurant
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EigomenyuUpdateRestaurantBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EigomenyuRestaurant"
        "404":
          description: Not found

  /eigomenyu/restaurants/{slug}/items:
    get:
      operationId: eigomenyuGetMenuItems
      tags: [eigomenyu]
      summary: Get menu items for a restaurant
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Menu items list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EigomenyuMenuItem"
        "404":
          description: Restaurant not found
    post:
      operationId: eigomenyuCreateMenuItem
      tags: [eigomenyu]
      summary: Add a menu item to a restaurant
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EigomenyuCreateMenuItemBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EigomenyuMenuItem"
        "404":
          description: Restaurant not found

  /eigomenyu/restaurants/{slug}/items/{id}:
    patch:
      operationId: eigomenyuUpdateMenuItem
      tags: [eigomenyu]
      summary: Update a menu item
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EigomenyuUpdateMenuItemBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EigomenyuMenuItem"
        "404":
          description: Not found
    delete:
      operationId: eigomenyuDeleteMenuItem
      tags: [eigomenyu]
      summary: Delete a menu item
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /eigomenyu/translate:
    post:
      operationId: eigomenyuTranslate
      tags: [eigomenyu]
      summary: Translate a Japanese dish name to English using AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EigomenyuTranslateBody"
      responses:
        "200":
          description: Translation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EigomenyuTranslateResponse"
        "401":
          description: Authentication required
  /weather:
    get:
      operationId: getWeather
      tags: [weather]
      summary: Get weather for all resort locations
      description: Returns current weather and 7-day forecast for Thredbo, Perisher, Charlotte's Pass, and Jindabyne
      responses:
        "200":
          description: Weather data for all locations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeatherResponse"
        "500":
          description: Error fetching weather
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /weather/{locationId}:
    get:
      operationId: getLocationWeather
      tags: [weather]
      summary: Get weather for a specific location
      description: Returns current weather and 7-day forecast for a specific resort location
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
            enum: [thredbo, perisher, charlottes-pass, jindabyne]
      responses:
        "200":
          description: Weather data for the location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationWeather"
        "404":
          description: Location not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error fetching weather
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bus-services:
    get:
      operationId: getBusServices
      tags: [bus]
      summary: Get Cooma Coaches bus service information
      description: Returns Cooma Coaches Snowy Mountains bus service routes and timetables
      responses:
        "200":
          description: Bus service information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusServiceResponse"
  /webcams:
    get:
      operationId: getWebcams
      tags: [webcams]
      summary: Get all resort webcams
      description: Returns webcam feeds for all resort locations
      responses:
        "200":
          description: Webcam data for all locations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebcamResponse"
  /webcams/{locationId}:
    get:
      operationId: getLocationWebcams
      tags: [webcams]
      summary: Get webcams for a specific location
      description: Returns webcam feeds for a specific resort location
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
            enum: [thredbo, perisher, charlottes-pass, jindabyne]
      responses:
        "200":
          description: Webcam data for the location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationWebcams"
        "404":
          description: Location not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /road-conditions:
    get:
      operationId: getRoadConditions
      tags: [roads]
      summary: Get alpine road conditions
      description: Returns current road conditions for Snowy Mountains alpine roads from Transport for NSW
      responses:
        "200":
          description: Road condition data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoadConditionsResponse"
  /lift-status:
    get:
      operationId: getLiftStatus
      tags: [lifts]
      summary: Get lift status for all resorts
      description: Returns current lift operating status for Thredbo, Perisher, and Charlotte's Pass
      responses:
        "200":
          description: Lift status data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiftStatusResponse"
  /lift-status/{locationId}:
    get:
      operationId: getLocationLiftStatus
      tags: [lifts]
      summary: Get lift status for a specific resort
      description: Returns lift operating status for a specific resort
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
            enum: [thredbo, perisher, charlottes-pass]
      responses:
        "200":
          description: Lift status for the location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResortLiftStatus"
        "404":
          description: Location not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Dashboard:
      type: object
      properties:
        updatedAt:
          type: string
        liveTime:
          type: string
        nextUpdate:
          type: string
        totalSkiAreas:
          type: integer
        avgTemp:
          type: ["number", "null"]
        avgWind:
          type: ["number", "null"]
        topSnow24h:
          type: ["number", "null"]
        bestBase:
          type: ["number", "null"]
        bestResort:
          $ref: "#/components/schemas/Resort"
        regions:
          type: array
          items:
            $ref: "#/components/schemas/RegionSummary"
      required:
        - updatedAt
        - liveTime
        - nextUpdate
        - totalSkiAreas
        - avgTemp
        - avgWind
        - topSnow24h
        - bestBase
        - bestResort
        - regions

    RegionSummary:
      type: object
      properties:
        name:
          type: string
        nameJa:
          type: string
        resortCount:
          type: integer
        avgTemp:
          type: ["number", "null"]
        topSnow:
          type: ["number", "null"]
        bestBase:
          type: ["number", "null"]
      required:
        - name
        - nameJa
        - resortCount
        - avgTemp
        - topSnow
        - bestBase

    Resort:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        nameJa:
          type: ["string", "null"]
        region:
          type: string
        regionJa:
          type: ["string", "null"]
        snow24h:
          type: ["number", "null"]
        baseDepth:
          type: ["number", "null"]
        temp:
          type: ["number", "null"]
        wind:
          type: ["number", "null"]
        snowTomorrow:
          type: ["number", "null"]
        snowScore:
          type: ["number", "null"]
        rank:
          type: ["integer", "null"]
        weatherStation:
          type: ["string", "null"]
        sourceUpdatedAt:
          type: ["string", "null"]
        lat:
          type: ["number", "null"]
        lng:
          type: ["number", "null"]
        elevation:
          type: ["integer", "null"]
        websiteUrl:
          type: ["string", "null"]
      required:
        - id
        - name
        - region
        - snow24h
        - baseDepth
        - temp
        - wind
        - snowTomorrow
        - snowScore
        - rank

    MapMarker:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        nameJa:
          type: ["string", "null"]
        region:
          type: string
        lat:
          type: number
        lng:
          type: number
        snow24h:
          type: ["number", "null"]
        baseDepth:
          type: ["number", "null"]
        rank:
          type: ["integer", "null"]
        snowLevel:
          type: string
          enum: [heavy, moderate, light, none]
      required:
        - id
        - name
        - region
        - lat
        - lng
        - snowLevel

    RegionOutlook:
      type: object
      properties:
        region:
          type: string
        regionJa:
          type: string
        rank:
          type: integer
        signal:
          type: string
        snow24h:
          type: ["number", "null"]
        snow48h:
          type: ["number", "null"]
        snow72h:
          type: ["number", "null"]
        level:
          type: string
          enum: [None, Low, Moderate, High, Extreme]
        updatedAt:
          type: string
      required:
        - region
        - regionJa
        - rank
        - signal
        - snow24h
        - snow48h
        - snow72h
        - level
        - updatedAt

    AlertsData:
      type: object
      properties:
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/PowderAlert"
        stormTracker:
          type: array
          items:
            $ref: "#/components/schemas/StormEvent"
        updatedAt:
          type: string
      required:
        - alerts
        - stormTracker
        - updatedAt

    PowderAlert:
      type: object
      properties:
        id:
          type: string
        resort:
          type: string
        region:
          type: string
        expectedSnow:
          type: ["number", "null"]
        alertLevel:
          type: string
          enum: [watch, warning, powder_day]
        message:
          type: string
        messageJa:
          type: ["string", "null"]
        issuedAt:
          type: string
        expiresAt:
          type: ["string", "null"]
      required:
        - id
        - resort
        - region
        - alertLevel
        - message
        - issuedAt

    StormEvent:
      type: object
      properties:
        id:
          type: string
        region:
          type: string
        totalSnow:
          type: ["number", "null"]
        peakSnow24h:
          type: ["number", "null"]
        startDate:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, incoming, ended]
        description:
          type: string
        descriptionJa:
          type: ["string", "null"]
      required:
        - id
        - region
        - status
        - description

    Accommodation:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        nameJa:
          type: ["string", "null"]
        type:
          type: string
          enum: [hotel, ryokan, guesthouse, apartment]
        region:
          type: string
        address:
          type: ["string", "null"]
        addressJa:
          type: ["string", "null"]
        description:
          type: string
        descriptionJa:
          type: ["string", "null"]
        priceRange:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        websiteUrl:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        lat:
          type: ["number", "null"]
