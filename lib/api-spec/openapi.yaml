          JP: "#/components/schemas/EatJP"

    ElevationBand:
      type: object
      description: Forecast values for a single elevation band (upper, mid, or lower lift).
      properties:
        tempMaxC:
          type: number
          nullable: true
        tempMinC:
          type: number
          nullable: true
        snowfallCm:
          type: number
          nullable: true
        rainfallMm:
          type: number
          nullable: true
      required:
        - tempMaxC
        - tempMinC
        - snowfallCm
        - rainfallMm

    ElevationBandDay:
      type: object
      description: One day of elevation-banded forecast for a mountain.
      properties:
        date:
          type: string
          description: ISO-8601 date (yyyy-mm-dd).
        weatherDescription:
          type: string
        freezingLevelM:
          type: number
          nullable: true
        windAvgKmh:
          type: number
          nullable: true
        windMaxKmh:
          type: number
          nullable: true
        precipMm:
          type: number
          nullable: true
        bands:
          type: object
          properties:
            upper:
              $ref: "#/components/schemas/ElevationBand"
            mid:
              $ref: "#/components/schemas/ElevationBand"
            lower:
              $ref: "#/components/schemas/ElevationBand"
          required: [upper, mid, lower]
      required:
        - date
        - weatherDescription
        - freezingLevelM
        - windAvgKmh
        - windMaxKmh
        - precipMm
        - bands

    ElevationForecast:
      type: object
      properties:
        resortName:
          type: string
          description: Display name echoed back from the request `name` parameter (may be empty).
        source:
          type: string
          enum: [open-meteo]
        upperLiftElevationM:
          type: number
          nullable: true
        midLiftElevationM:
          type: number
          nullable: true
        lowerLiftElevationM:
          type: number
          nullable: true
        fetchedAt:
          type: string
          description: ISO-8601 timestamp string when the upstream forecast was fetched (kept as a plain string so generated zod schemas don't coerce to Date · the wire format is JSON text).
        days:
          type: array
          items:
            $ref: "#/components/schemas/ElevationBandDay"
      required:
        - resortName
        - source
        - upperLiftElevationM
        - midLiftElevationM
        - lowerLiftElevationM
        - fetchedAt
        - days

    ElevationForecastResponse:
      type: object
      description: Envelope wrapping the elevation-banded forecast (forecast may be null when upstream returned no data).
      properties:
        configured:
          type: boolean
        forecast:
          oneOf:
            - $ref: "#/components/schemas/ElevationForecast"
            - type: "null"
      required:
        - configured
        - forecast
