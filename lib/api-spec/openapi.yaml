    ResortSnowReport:
      type: object
      description: |
        Snow conditions from an official source, strictly parsed - base must
        be present and numeric or the whole report is treated as absent
        (never defaulted to 0, which would assert "no base" without
        evidence). `kind` distinguishes the resort's own report ("resort")
        from an official off-resort snow-course measurement ("course",
        e.g. Snowy Hydro's weekly Spencers Creek reading - natural snow
        only, so it may display a base but never assert "no base").
      properties:
        kind:
          type: string
          enum: [resort, course]
          description: >
            Provenance - "resort" = the resort's own official report;
            "course" = official off-resort snow-course measurement.
            Optional for backwards compatibility; absent means "resort".
        baseCm:
          type: number
          description: >
            Reported snow base depth in centimetres. When the resort reports
            two station readings (upper/lower or an unordered range), this is
            the HIGHER of the pair - skiability gating keys off it so "no
            base" is only asserted when the best station is bare.
        baseMinCm:
          type: number
          description: >
            Lower reading of a two-station / range report, in centimetres.
            Present only when the resort publishes two distinct base figures
            (sorted numerically - never labelled upper/lower, some feeds swap
            them). Absent for single-figure reports.
        seasonSnowfallCm:
          type: number
          nullable: true
          description: Cumulative season snowfall in centimetres, when the feed provides it.
        lastSnowfallCm:
          type: number
          nullable: true
          description: Most recent snowfall amount in centimetres, when the feed provides it.
        updatedAt:
          type: string
          description: ISO 8601 timestamp the resort last updated the report.
        sourceName:
          type: string
          description: Human name of the reporting resort, e.g. "Thredbo".
        sourceUrl:
          type: string
          description: Human snow-report page to credit/link, NOT the feed URL.
      required:
        - baseCm
        - updatedAt
        - sourceName
        - sourceUrl
    ResortSnowReportResponse:
      type: object
      properties:
        locationId:
          type: string
        report:
          oneOf:
            - $ref: "#/components/schemas/ResortSnowReport"
          nullable: true
          description: >
            Null when no adapter, feed failure, strict-parse failure, or
            report older than the source's freshness window (36h for resort
            feeds, ~10 days for weekly snow-course readings).
      required:
        - locationId
        - report
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message

    StayEatRegionSlug:
      type: string
      enum:
        - snowy_mountains
        - yamanouchi
      description: |
        Region slug used by the curated Stay/Eat dataset (underscore-separated to
        match the on-disk JSON files under artifacts/feelzlike/src/data/curated).
        Distinct from the canonical kebab-case `RegionId` enum used by live
        weather/webcam/road APIs — both coexist by design while we keep the
        curated dataset's existing slug taxonomy. Translation between the two
        styles happens at the resolver boundary in the frontend.

    TownSlug:
      type: string
      enum:
        - jindabyne
        - berridale
        - cooma
        - yudanaka
        - shibu_onsen
        - yomase
      description: Curated-dataset town slug. Underscore-separated to match the on-disk JSON files (e.g. `shibu_onsen`, not `shibu-onsen`).

    PriceBand:
      type: string
      enum: ["$", "$$", "$$$", "$$$$"]
      description: Price tier rendered as 1–4 filled circles in the UI.

    EnglishSpoken:
      type: string
      enum: [yes, limited, no]

    YesNo:
      type: string
      enum: [yes, no]

    YesLimitedNo:
      type: string
      enum: [yes, limited, no]

    StayBookingLinks:
      type: object
      description: Affiliate-and-direct booking URLs per provider. Any subset may be present; missing or null means "no link for this provider".
      properties:
        booking_com:
          type: ["string", "null"]
        agoda:
          type: ["string", "null"]
        airbnb:
          type: ["string", "null"]
        expedia:
          type: ["string", "null"]
        hotels_com:
          type: ["string", "null"]
        trip_com:
          type: ["string", "null"]
        jalan:
          type: ["string", "null"]
        rakuten:
          type: ["string", "null"]
        official:
          type: ["string", "null"]

    EatHours:
      type: object
      description: Day-by-day opening hours as free-form strings (e.g. "11:00–14:30, 17:00–21:00"). All keys optional.
      properties:
        monday:
          type: ["string", "null"]
        tuesday:
          type: ["string", "null"]
        wednesday:
          type: ["string", "null"]
        thursday:
          type: ["string", "null"]
        friday:
          type: ["string", "null"]
        saturday:
          type: ["string", "null"]
        sunday:
          type: ["string", "null"]
        closed:
          type: ["string", "null"]

    StayBase:
      type: object
      description: Shared fields for every Stay record across both countries. Country-specific extras live on `StayAU` / `StayJP`.
      properties:
        id:
          type: string
        name:
          type: string
        name_local:
          type: ["string", "null"]
          description: Local-script name (kanji/katakana for Japan). Null for AU.
        type:
          type: string
          enum: [ryokan, hotel, lodge, apartment, airbnb, hostel, minshuku, guesthouse, resort, motel, cabin, bnb]
        town:
          $ref: "#/components/schemas/TownSlug"
        region:
          $ref: "#/components/schemas/StayEatRegionSlug"
        short_description:
          type: string
        long_description:
          type: string
        address:
          type: ["string", "null"]
        lat:
          type: ["number", "null"]
        lng:
          type: ["number", "null"]
        phone:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        price_band:
          oneOf:
            - $ref: "#/components/schemas/PriceBand"
            - type: "null"
        photos:
          type: array
          items:
            type: string
        source_urls:
          type: array
          items:
            type: string
        room_count:
          type: ["number", "null"]
        amenities:
          type: array
          items:
            type: string
        english_spoken:
          oneOf:
            - $ref: "#/components/schemas/EnglishSpoken"
            - type: "null"
        check_in:
          type: ["string", "null"]
        check_out:
          type: ["string", "null"]
        booking_links:
          $ref: "#/components/schemas/StayBookingLinks"
        nearest_mountain:
          type: ["string", "null"]
        drive_min_to_nearest_mountain:
          type: ["number", "null"]
        drive_min_to_each_mountain:
          oneOf:
            - type: object
              additionalProperties:
                type: ["number", "null"]
            - type: "null"
        notes:
          type: ["string", "null"]
      required:
        - id
        - name
        - name_local
        - type
        - town
        - region
        - short_description
        - long_description
        - address
        - lat
        - lng
        - phone
        - website
        - price_band
        - photos
        - source_urls
        - amenities
        - booking_links

    StayAU:
      allOf:
        - $ref: "#/components/schemas/StayBase"
        - type: object
          properties:
            country:
              type: string
              enum: [AU]
            drying_room:
              oneOf:
                - $ref: "#/components/schemas/YesNo"
                - type: "null"
            ski_storage:
              oneOf:
                - $ref: "#/components/schemas/YesNo"
                - type: "null"
            pet_friendly:
              oneOf:
                - $ref: "#/components/schemas/YesNo"
                - type: "null"
            self_contained:
