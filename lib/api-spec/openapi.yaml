          type: number
        dataSource:
          type: string
        bomStation:
          type: string
        bomObservationTime:
          type: string
        freezingLevel:
          type: number
          description: Height of the 0°C isotherm above mean sea level, in metres (Open-Meteo).
        snowfallPast24h:
          type: number
          description: |
            Cumulative fresh snow over the previous 24 full hours, in
            centimetres (Open-Meteo `snowfall`, model-estimated). Derived at
            the same elevation as the snowfallNext24h outlook. Omitted when
            the upstream source has no past hours (e.g. the OpenWeatherMap
            fallback) - unknown is never reported as 0.
        snowfallNext24h:
          type: number
          description: Cumulative fresh snow over the next 24 hours, in centimetres (Open-Meteo `snowfall`).
        snowfallNext48h:
          type: number
          description: Cumulative fresh snow over the next 48 hours, in centimetres (Open-Meteo `snowfall`).
        snowfallNext72h:
          type: number
          description: Cumulative fresh snow over the next 72 hours, in centimetres (Open-Meteo `snowfall`).
        snowfallOutlookElevationM:
          type: number
          description: Elevation in metres the snowfallNext24h/48h/72h outlook was derived at.
        snowfallOutlookLevel:
          type: string
          description: |
            Provenance of the snow outlook elevation. "village" is the resort's
            current/base elevation (default); "mid-mountain" means the headline
            snow reflects an on-mountain height requested via snowElevationM.
