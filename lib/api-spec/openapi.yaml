          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Dashboard:
      type: object
      properties:
        updatedAt:
          type: string
        liveTime:
          type: string
        nextUpdate:
          type: string
        totalSkiAreas:
          type: integer
        avgTemp:
          type: ["number", "null"]
        avgWind:
          type: ["number", "null"]
        topSnow24h:
          type: ["number", "null"]
        bestBase:
          type: ["number", "null"]
        bestResort:
          $ref: "#/components/schemas/Resort"
        regions:
          type: array
          items:
            $ref: "#/components/schemas/RegionSummary"
      required:
        - updatedAt
        - liveTime
        - nextUpdate
        - totalSkiAreas
        - avgTemp
        - avgWind
        - topSnow24h
        - bestBase
        - bestResort
        - regions

    RegionSummary:
      type: object
      properties:
        name:
          type: string
        nameJa:
          type: string
        resortCount:
          type: integer
        avgTemp:
          type: ["number", "null"]
        topSnow:
          type: ["number", "null"]
        bestBase:
          type: ["number", "null"]
      required:
        - name
        - nameJa
        - resortCount
        - avgTemp
        - topSnow
        - bestBase

    Resort:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        nameJa:
          type: ["string", "null"]
        region:
          type: string
        regionJa:
          type: ["string", "null"]
        snow24h:
          type: ["number", "null"]
        baseDepth:
          type: ["number", "null"]
        temp:
          type: ["number", "null"]
        wind:
          type: ["number", "null"]
        snowTomorrow:
          type: ["number", "null"]
        snowScore:
          type: ["number", "null"]
        rank:
          type: ["integer", "null"]
        weatherStation:
          type: ["string", "null"]
        sourceUpdatedAt:
          type: ["string", "null"]
        lat:
          type: ["number", "null"]
        lng:
          type: ["number", "null"]
        elevation:
          type: ["integer", "null"]
        websiteUrl:
          type: ["string", "null"]
      required:
        - id
        - name
        - region
        - snow24h
        - baseDepth
        - temp
        - wind
        - snowTomorrow
        - snowScore
        - rank

    MapMarker:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        nameJa:
          type: ["string", "null"]
        region:
          type: string
        lat:
          type: number
        lng:
          type: number
        snow24h:
          type: ["number", "null"]
        baseDepth:
          type: ["number", "null"]
        rank:
          type: ["integer", "null"]
        snowLevel:
          type: string
          enum: [heavy, moderate, light, none]
      required:
        - id
        - name
        - region
        - lat
        - lng
        - snowLevel

    RegionOutlook:
      type: object
      properties:
        region:
          type: string
        regionJa:
          type: string
        rank:
          type: integer
        signal:
          type: string
        snow24h:
          type: ["number", "null"]
        snow48h:
          type: ["number", "null"]
        snow72h:
          type: ["number", "null"]
        level:
          type: string
          enum: [None, Low, Moderate, High, Extreme]
        updatedAt:
          type: string
      required:
        - region
        - regionJa
        - rank
        - signal
        - snow24h
        - snow48h
        - snow72h
        - level
        - updatedAt

    AlertsData:
      type: object
      properties:
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/PowderAlert"
        stormTracker:
          type: array
          items:
            $ref: "#/components/schemas/StormEvent"
        updatedAt:
          type: string
      required:
        - alerts
        - stormTracker
        - updatedAt

    PowderAlert:
      type: object
      properties:
        id:
          type: string
        resort:
          type: string
        region:
          type: string
        expectedSnow:
          type: ["number", "null"]
        alertLevel:
          type: string
          enum: [watch, warning, powder_day]
        message:
          type: string
        messageJa:
          type: ["string", "null"]
        issuedAt:
          type: string
        expiresAt:
          type: ["string", "null"]
      required:
        - id
        - resort
        - region
        - alertLevel
        - message
        - issuedAt

    StormEvent:
      type: object
      properties:
        id:
          type: string
        region:
          type: string
        totalSnow:
          type: ["number", "null"]
        peakSnow24h:
          type: ["number", "null"]
        startDate:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, incoming, ended]
        description:
          type: string
        descriptionJa:
          type: ["string", "null"]
      required:
        - id
        - region
        - status
        - description

    Accommodation:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        nameJa:
          type: ["string", "null"]
        type:
          type: string
          enum: [hotel, ryokan, guesthouse, apartment]
        region:
          type: string
        address:
          type: ["string", "null"]
        addressJa:
          type: ["string", "null"]
        description:
          type: string
        descriptionJa:
          type: ["string", "null"]
        priceRange:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        websiteUrl:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        lat:
          type: ["number", "null"]
        lng:
          type: ["number", "null"]
        amenities:
          type: ["string", "null"]
        onsenAvailable:
          type: boolean
        skiInSkiOut:
          type: boolean
        featured:
          type: boolean
      required:
        - id
        - name
        - type
        - region
        - description
        - onsenAvailable
        - skiInSkiOut
        - featured

    CreateAccommodationBody:
      type: object
      properties:
        name:
          type: string
        nameJa:
          type: ["string", "null"]
        type:
